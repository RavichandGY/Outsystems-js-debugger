<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="lib/codemirror.css">
  <link rel="stylesheet" href="lib/foldgutter.css">

  <style>
    body {
      margin: 0;
      font-family: monospace;
      height: 100vh;
      overflow: hidden;
    }

    #layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ================= LEFT PANEL ================= */
    #list {
      border-right: 1px solid #ccc;
      overflow-y: auto;
      position: relative;
      z-index: 100;
    }

    .row {
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .row:hover {
      background: #f0f0f0;
    }

    .row.active {
      background: #e6f0ff;
      color: #0b5fff;
      border-left: 4px solid #0b5fff;
    }

    .row.active:hover {
      background: #dbe9ff;
    }

    /* ================= RIGHT PANEL ================= */
    #right {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    /* Toolbar */
    #toolbar {
      padding: 6px;
      border-bottom: 1px solid #ccc;
      background: #fafafa;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    #status {
      margin-left: 10px;
      font-weight: bold;
    }

    /* ================= BREADCRUMB BAR ================= */
    #breadcrumb-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      font-size: 12px;
      color: #555;
      border-bottom: 1px solid #ddd;
      background: #fff;
      flex-shrink: 0;
    }

    #breadcrumb {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #breadcrumb-action {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #0b5fff;
      user-select: none;
    }

    #breadcrumb-action:hover {
      text-decoration: underline;
    }

    /* ================= EDITOR ================= */
    #editor {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .CodeMirror {
      height: 100% !important;
    }

    /* ================= FOOTER ================= */
    #footer {
      font-size: 11px;
      padding: 4px 8px;
      border-top: 1px solid #ddd;
      text-align: center;
      color: #666;
      background: #fafafa;
      flex-shrink: 0;
    }

    /* Error highlight */
    .cm-error-line {
      background: rgba(255, 0, 0, 0.15);
    }
  </style>
</head>

<body>
  <div id="layout">

    <!-- ================= LEFT PANEL ================= -->
    <div id="list">
      <div class="row" data-type="OnInitialize">OnInitialize</div>
      <div class="row" data-type="OnReady">OnReady</div>
      <div class="row" data-type="OnRender">OnRender</div>
      <div class="row" data-type="OnAfterFetch">OnAfterFetch</div>
      <div class="row" data-type="Others">Others</div>
    </div>

    <!-- ================= RIGHT PANEL ================= -->
    <div id="right">

      <!-- TOOLBAR -->
      <div id="toolbar">
        <button id="run">▶ Run</button>
        <button id="reset">↩ Reset</button>
        <span id="status"></span>
      </div>

      <!-- BREADCRUMB BAR -->
      <div id="breadcrumb-bar">
        <div id="breadcrumb"></div>
        <div id="breadcrumb-action" title="Navigate to source file">
          🔗 <span>Navigate to source file</span>
        </div>
      </div>

      <!-- EDITOR -->
      <div id="editor"></div>

      <!-- FOOTER -->
      <div id="footer">
        © 2025 Ravichand GY · OutSystems JS Debugger · All rights reserved
      </div>
    </div>

  </div>

  <!-- ================= SCRIPTS ================= -->

  <!-- CodeMirror core -->
  <script src="lib/codemirror.js"></script>

  <!-- Language -->
  <script src="lib/javascript.js"></script>

  <!-- Folding -->
  <script src="lib/foldcode.js"></script>
  <script src="lib/foldgutter.js"></script>
  <script src="lib/brace-fold.js"></script>

  <!-- Panel logic -->
  <script src="panel.js"></script>
</body>
</html>
