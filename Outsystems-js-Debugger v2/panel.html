<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>OutSystems JS Debugger</title>

  <link rel="stylesheet" href="lib/codemirror.css" />

  <style>
    body {
      margin: 0;
      font-family: monospace;
      height: 100vh;
      overflow: hidden;
    }

    #layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: 100vh;
    }

    /* ============ LEFT PANEL ============ */
    #left {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ccc;
      background: #fafafa;
      min-height: 0; /* REQUIRED */
    }

    #search {
      padding: 6px 8px;
      border: none;
      border-bottom: 1px solid #ccc;
      font-family: monospace;
      font-size: 13px;
      outline: none;
    }

    #list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    /* ============ TREE ============ */
    .tree-node {
      position: relative;
      padding-left: 16px;
    }

    .tree-node::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 0;
      bottom: 0;
      border-left: 1px dashed #bbb;
    }

    .tree-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 3px 4px;
      border-radius: 4px;
      user-select: none;
      white-space: nowrap;
    }

    .tree-label:hover {
      background: #eef3ff;
    }

    .tree-arrow {
      width: 12px;
      font-size: 10px;
      color: #555;
      text-align: center;
    }

    .tree-node.open > .tree-label .tree-arrow::before {
      content: "▼";
    }

    .tree-label .tree-arrow::before {
      content: "▶";
    }

    .tree-children {
      display: none;
      margin-left: 12px;
    }

    .tree-node.open > .tree-children {
      display: block;
    }

    .tree-parent {
      font-weight: bold;
    }

    .tree-js {
      padding-left: 12px;
    }

    .tree-selected {
      background: #dbe9ff !important;
      color: #0b5fff;
    }

    .count {
      margin-left: auto;
      font-size: 11px;
      color: #777;
    }

    /* ============ RIGHT PANEL ============ */
    #right {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    #toolbar {
      padding: 6px;
      border-bottom: 1px solid #ccc;
      background: #fafafa;
      display: flex;
      gap: 8px;
    }

    #breadcrumb-bar {
      padding: 6px 10px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    #breadcrumb-action {
      cursor: pointer;
      color: #0b5fff;
    }

    #editor {
      flex: 1;
      min-height: 0;
    }

    .CodeMirror {
      height: 100% !important;
      font-size: 13px;
    }

    #footer {
      font-size: 11px;
      padding: 4px;
      border-top: 1px solid #ddd;
      text-align: center;
      color: #666;
      background: #fafafa;
    }
  </style>
</head>

<body>
  <div id="layout">

    <div id="left">
      <input id="search" placeholder="Search screens, blocks, JS…" />
      <div id="list"></div>
    </div>

    <div id="right">
      <div id="toolbar">
        <button id="run">▶ Run</button>
        <button id="reset">↩ Reset</button>
        <span id="status"></span>
      </div>

      <div id="breadcrumb-bar">
        <div id="breadcrumb"></div>
        <div id="breadcrumb-action">Open source</div>
      </div>

      <div id="editor"></div>

      <div id="footer">
        © 2025 Ravichand GY · OutSystems JS Debugger v1.2.0
      </div>
    </div>
  </div>

  <script src="lib/codemirror.js"></script>
  <script src="lib/javascript.js"></script>
  <script src="panel.js"></script>
</body>
</html>
